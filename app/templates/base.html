<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">

<title>{{ seo_title|default("Line Dancing John | Lessons, Events & Private Bookings") }}</title>

<meta
    name="description"
    content="{{ seo_description|default('Line Dancing John offers welcoming line dancing lessons, events, private instruction, parties, business events, and cruise ship classes in Southern California.') }}"
>

<link rel="canonical" href="{{ request.base_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo_title|default('Line Dancing John | Lessons, Events & Private Bookings') }}">
<meta property="og:description" content="{{ seo_description|default('Line dancing lessons, events, private instruction, parties, celebrations, business events, and cruise ship classes with Line Dancing John.') }}">
<meta property="og:url" content="{{ request.base_url }}">

<meta name="robots" content="index, follow">

<link
    rel="icon"
    href="{{ versioned_static('images/branding/LD-Icon.png') }}"
    type="image/png"
>

<link rel="stylesheet" href="{{ versioned_static('css/style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">


</head>

<body>

<div class="page">

<header class="site-header">

    <div class="header-banner">

        <img src="{{ url_for('static', filename='images/branding/john-banner.png') }}"
            alt="Line Dancing John">
    </div>

    <nav class="main-nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('lessons') }}">Lessons</a>
        <a href="{{ url_for('gallery') }}">Gallery</a>
        <a href="{{ url_for('home') }}#follow">Follow</a>
        <a href="{{ url_for('home') }}#contact">Contact</a>

        {% if session.get('admin_logged_in') %}
        <form action="{{ url_for('admin.logout') }}" method="POST" class="logout-form">
            <button type="submit" class="logout-link">Logout</button>
        </form>
        {% endif %}
    </nav>

</header>

<main>

{% block content %}

{% endblock %}

</main>

<footer>
    <p>© 2026 Line Dancing John</p>
    <a href="{{ url_for('admin.login') }}">Admin</a>
</footer>


<div id="lightbox">

    <span class="close">&times;</span>

    <div class="lightbox-content">

        <img id="lightbox-image">

        <p id="lightbox-caption"></p>

        <div class="lightbox-nav">
            <span id="previous" class="arrow" aria-label="Previous image">&#10094;</span>
            <span id="next" class="arrow" aria-label="Next image">&#10095;</span>
        </div>

    </div>

</div>

</div>

<script src="{{ versioned_static('js/script.js') }}"></script>

</body>

</html>
