{% extends "base.html" %}

{% block content %}
<div class="admin-dashboard">
    <h1>{{ event.title }}</h1>
    <h2>Gallery</h2>

    <div class="photo-grid">
        {% for photo in photos %}
        <div class="photo-card">
            <img src="{{ image_src(photo.url) }}" alt="Event Photo">

            <div class="photo-order-controls">
                <form action="{{ url_for('admin.move_photo_page') }}" method="POST">
                    <input type="hidden" name="slug" value="{{ event.slug }}">
                    <input type="hidden" name="public_id" value="{{ photo.public_id }}">
                    <input type="hidden" name="direction" value="up">
                    <button type="submit" {% if loop.first %}disabled{% endif %}>↑ Up</button>
                </form>
                <form action="{{ url_for('admin.move_photo_page') }}" method="POST">
                    <input type="hidden" name="slug" value="{{ event.slug }}">
                    <input type="hidden" name="public_id" value="{{ photo.public_id }}">
                    <input type="hidden" name="direction" value="down">
                    <button type="submit" {% if loop.last %}disabled{% endif %}>↓ Down</button>
                </form>
            </div>

            <form action="{{ url_for('admin.update_photo_caption_page') }}" method="POST" class="photo-caption-form">
                <input type="hidden" name="slug" value="{{ event.slug }}">
                <input type="hidden" name="public_id" value="{{ photo.public_id }}">
                <label>Caption</label>
                <textarea name="caption" rows="2" placeholder="Optional caption">{{ photo.caption }}</textarea>
                <button type="submit">Save Caption</button>
            </form>

            <form action="{{ url_for('admin.delete_photo') }}" method="POST" onsubmit="return confirm('Delete this photo?');">
                <input type="hidden" name="slug" value="{{ event.slug }}">
                <input type="hidden" name="public_id" value="{{ photo.public_id }}">
                <button class="delete-btn" type="submit">🗑 Delete</button>
            </form>
        </div>
        {% else %}
        <p>No gallery photos have been uploaded yet.</p>
        {% endfor %}
    </div>

    <br>
    <a href="{{ url_for('admin.dashboard') }}">← Back to Dashboard</a>
</div>
{% endblock %}
