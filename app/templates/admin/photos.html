{% extends "base.html" %}

{% block content %}

<div class="admin-dashboard">

    <h1>{{ event.title }}</h1>

    <h2>Gallery</h2>

    <div class="photo-grid">

        {% for photo in photos %}

        <div class="photo-card">

            <img
                src="{{ image_src(photo.url) }}"
                alt="Event Photo"
            >

            <form
                action="{{ url_for('admin.delete_photo') }}"
                method="POST"
            >

                <input
                    type="hidden"
                    name="slug"
                    value="{{ event.slug }}"
                >

                <input
                    type="hidden"
                    name="public_id"
                    value="{{ photo.public_id }}"
                >

                <button class="delete-btn" type="submit">
                    🗑 Delete
                </button>

            </form>

        </div>

        {% else %}

        <p>No gallery photos have been uploaded yet.</p>

        {% endfor %}

    </div>

    <br>

    <a href="{{ url_for('admin.dashboard') }}">
        ← Back to Dashboard
    </a>

</div>

{% endblock %}
