{% extends "base.html" %}

{% block content %}
<div class="admin-dashboard admin-hub">
    <h1>LDJ Control Panel</h1>
    <p>Choose a section to manage.</p>

    <div class="admin-hub-grid">
        <a href="{{ url_for('admin.home_page') }}" class="admin-hub-card">
            <h2>Home</h2>
            <p>Manage homepage sections and images</p>
        </a>

        <a href="{{ url_for('admin.events_dashboard') }}" class="admin-hub-card">
            <h2>Events</h2>
            <p>Add, edit, delete, and manage event photos</p>
        </a>

        <a href="{{ url_for('admin.lessons_page') }}" class="admin-hub-card">
            <h2>Lessons</h2>
            <p>Upload, reorder, and delete lesson flyers</p>
        </a>
    </div>
</div>
{% endblock %}
